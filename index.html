<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050508">
<title>VIDEOS STREAM Premium</title>
<meta name="description" content="VIDEOS STREAM - Koleksi video pilihan dengan tampilan premium.">

<style>
:root{
  --bg:#050508;
  --panel:#100d1a;
  --gold:#8a2be2;
  --gold2:#b174ff;
  --text:#f5f5f5;
  --muted:#a7b0c0;
  --border:rgba(138,43,226,.25);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
button,input{font:inherit}
header{
  background:linear-gradient(135deg,#120924,#050508);
  border-bottom:1px solid var(--border);
  padding:18px 14px;
}
.header-inner{
  max-width:1150px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:43px;height:43px;
  border-radius:12px;
  background:linear-gradient(135deg,var(--gold2),#4b0082);
  color:#fff;
  display:grid;
  place-items:center;
  font-size:22px;
  font-weight:900;
}
.brand h1{margin:0;font-size:21px;letter-spacing:1px}
.brand small{color:var(--gold2);font-size:10px;letter-spacing:2px}
.header-label{
  color:var(--gold2);
  border:1px solid var(--border);
  padding:7px 11px;
  border-radius:20px;
  font-size:11px;
}
.container{
  max-width:1150px;
  margin:auto;
  padding:18px 14px 35px;
}

/* PLAYER DI ATAS */
.player-section{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:15px;
  padding:13px;
  margin-bottom:20px;
  scroll-margin-top:10px;
}
.player-heading{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  margin-bottom:12px;
}
.player-heading h2{
  margin:0;
  font-size:16px;
  color:var(--gold2);
}
.player-heading span{font-size:10px;color:var(--muted)}
.player-frame{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  border-radius:10px;
  overflow:hidden;
}
.player-frame iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}
.player-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}
.action-btn{
  flex:1;
  min-width:100px;
  border:1px solid var(--border);
  background:#171026;
  color:var(--gold2);
  padding:11px 9px;
  border-radius:8px;
  cursor:pointer;
  font-size:12px;
}
.action-btn.primary{
  background:var(--gold);
  color:#fff;
  font-weight:bold;
}
.notice{
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
  margin-top:12px;
}

/* HERO */
.hero{
  background:linear-gradient(120deg,#180d2e,#0a0712 65%,#20102b);
  border:1px solid var(--border);
  border-radius:17px;
  padding:22px 18px;
  margin-bottom:20px;
}
.hero h2{margin:0 0 8px;font-size:23px;color:var(--gold2)}
.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:22px 0 13px;
}
.section-title h2{font-size:17px;margin:0}
.section-title span{color:var(--gold2);font-size:11px}
.search-wrap{margin-bottom:13px}
.search-wrap input{
  width:100%;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:13px 14px;
  color:white;
  outline:none;
}
.search-wrap input:focus{border-color:var(--gold)}
.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:5px;
  margin-bottom:16px;
}
.tab{
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  padding:9px 14px;
  border-radius:20px;
  white-space:nowrap;
  cursor:pointer;
  font-size:12px;
}
.tab.active{background:var(--gold);color:#fff;font-weight:bold}

/* VIDEO GRID */
.video-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
}
.video-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
}
.video-card:hover{transform:translateY(-3px);border-color:var(--gold)}
.thumb{
  position:relative;
  aspect-ratio:16/10;
  overflow:hidden;
  background:#130b20;
}
.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:.3s;
}
.video-card:hover .thumb img{transform:scale(1.04)}
.play-icon{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  background:rgba(0,0,0,.15);
}
.play-icon span{
  width:43px;height:43px;
  border-radius:50%;
  display:grid;
  place-items:center;
  padding-left:3px;
  background:rgba(138,43,226,.92);
  color:#fff;
  font-size:19px;
}
.video-info{padding:10px}
.video-info h3{
  font-size:12px;
  line-height:1.45;
  margin:0 0 7px;
  min-height:35px;
}
.video-meta{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:10px;
}
.video-meta b{color:var(--gold2)}
.empty{
  display:none;
  text-align:center;
  color:var(--muted);
  padding:35px 10px;
}
.pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  margin:22px 0;
  flex-wrap:wrap;
}
.page-btn{
  border:1px solid var(--border);
  background:var(--panel);
  color:white;
  padding:9px 13px;
  border-radius:8px;
  cursor:pointer;
}
.page-btn.active{background:var(--gold);color:#fff;font-weight:bold}
.page-btn:disabled{opacity:.35;cursor:not-allowed}
footer{
  text-align:center;
  border-top:1px solid var(--border);
  color:var(--muted);
  padding:22px 12px;
  font-size:11px;
  line-height:1.8;
  margin-top:30px;
}
footer strong{color:var(--gold2)}

/* --- STYLING IN-PAGE PUSH (MENUTUPI VIDEO DI TENGAH) --- */
.inp-push-container {
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: rgba(5, 5, 8, 0.85);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn 0.3s ease-out forwards;
}

.inp-push-container.show {
  display: flex;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.inp-push-box {
  background: linear-gradient(145deg, #181028, #050508);
  border: 1px solid var(--gold);
  border-radius: 16px;
  padding: 20px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  position: relative;
  cursor: pointer;
  animation: scaleUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

@keyframes scaleUp {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.inp-push-close {
  position: absolute;
  top: 10px;
  right: 12px;
  border: 0;
  background: rgba(255, 255, 255, 0.1);
  color: var(--muted);
  width: 30px;
  height: 30px;
  border-radius: 50%;
  font-size: 16px;
  cursor: pointer;
  z-index: 10;
  display: grid;
  place-items: center;
}
.inp-push-close:hover {
  background: rgba(255, 255, 255, 0.2);
  color: white;
}

.inp-push-thumb {
  width: 100%;
  height: 160px;
  border-radius: 10px;
  object-fit: cover;
  margin-bottom: 14px;
  border: 1px solid var(--border);
}

.inp-push-content {
  width: 100%;
}

.inp-push-badge {
  display: inline-block;
  background: var(--gold);
  color: #fff;
  font-size: 10px;
  font-weight: bold;
  padding: 3px 8px;
  border-radius: 4px;
  margin-bottom: 8px;
  letter-spacing: 0.5px;
}

.inp-push-title {
  color: var(--gold2);
  font-size: 15px;
  font-weight: bold;
  margin: 0 0 6px;
  line-height: 1.35;
}

.inp-push-desc {
  color: #c2c9d4;
  font-size: 12px;
  margin: 0 0 16px;
  line-height: 1.5;
}

.inp-push-btn {
  background: var(--gold);
  color: #fff;
  border: none;
  width: 100%;
  padding: 10px;
  font-weight: bold;
  font-size: 13px;
  border-radius: 8px;
  cursor: pointer;
}

@media(max-width:850px){
  .video-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:600px){
  .video-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .brand h1{font-size:17px}
  .header-label{font-size:9px}
  .hero h2{font-size:20px}
  .container{padding-left:11px;padding-right:1
